<div class="login-card">
  <p class="eyebrow">Lending Library Portal</p>
  <h2>Sign In</h2>
  <p class="sub">Use your member, staff, or admin account.</p>

  <form (ngSubmit)="onSubmit()">
    <label>
      Email
      <input type="email" [(ngModel)]="email" name="email" required>
    </label>
    <label>
      Password
      <input type="password" [(ngModel)]="password" name="password" required>
    </label>
    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }
    <button type="submit">Continue</button>
  
  </form>
  <p class="hint">Don't have an account? <a routerLink="/register">Create one</a></p>

  <p class="hint">If login fails, confirm your user exists in STAFF or MEMBERS and has an encoded password.</p>
</div>
